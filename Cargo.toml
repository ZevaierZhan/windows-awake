[package]
name = "windows-awake"
version = "0.1.0"
edition = "2024"
description = "Idle-aware Windows keep-awake tray utility without cursor displacement"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_System_StationsAndDesktops"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
